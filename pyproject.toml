[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hotspot3"
version = "1.0.2"
description = "Chromatin accessibility peak caller with an adaptive background model"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Sergey Abramov" },
  { name = "Alexandr Boytsov" },
  { name = "Jeff Vierstra" }
]

requires-python = ">=3.8"
dependencies = [
  "numpy<2.0",
  "pandas",
  "scipy",
  "statsmodels",
  "pysam",
  "tqdm",
  "PyWavelets",
  "scikit-learn",
  "pyarrow",
  "Bottleneck",
  "pyBigWig",
  "networkx",
  "babachi==3.0.0",
  "genome-tools>=2.0.0",
]

[project.optional-dependencies]
# development scripts (hotspot3-track-mem)
dev = ["psutil"]

[project.urls]
Homepage = "https://github.com/vierstralab/hotspot3"

[project.scripts]
hotspot3 = "hotspot3.cli:main"
hotspot3-cutcounts = "hotspot3.extract_cutcounts:main"
hotspot3-track-mem = "hotspot3.track_memory:main"
# unfinished: multi-sample FDR correction
# hotspot3-fdr = "hotspot3.multiple_sample_fdr:main"
hotspot3-pvals = "hotspot3.extract_pvals:main"
hotspot3-trackhub = "hotspot3.ucsc_trackhub:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hotspot3 = ["scripts/extract_cutcounts.sh"]

[tool.bumpversion]
current_version = "1.0.2"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
